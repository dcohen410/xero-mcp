[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "xero-mcp"
version = "0.1.0"
description = "A local MCP server that lets Claude work with your Xero organisation, using Xero's free PKCE sign-in."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27,<1",
    "keyring>=24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]

[project.scripts]
xero-mcp = "xero_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/xero_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
